name: Build & Publish Multi-Platform Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  GYP_MSVS_VERSION: "2022"
  npm_config_msvs_version: "2022"

jobs:
  build-release:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        run: |
          git config --global core.autocrlf false
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }} || true
        shell: bash

      - name: Install Dependencies
        run: npm ci
        shell: bash

      # --- Windows Build (Setup .exe & Portable .zip) ---
      - name: Build Windows Installer (.exe Setup)
        if: runner.os == 'Windows'
        env:
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"
        run: |
          npx electron-forge make --platform=win32 --arch=x64
          mkdir -p dist-release
          cp out/make/squirrel.windows/x64/*.exe dist-release/Octopus-Studio-Setup-1.10.0.exe 2>/dev/null || cp out/make/squirrel.windows/x64/*.exe dist-release/ 2>/dev/null || true
          cp out/make/squirrel.windows/x64/*.nupkg dist-release/ 2>/dev/null || true
          cp out/make/zip/win32/x64/*.zip dist-release/Octopus-Studio-Windows-Portable.zip 2>/dev/null || cp out/make/zip/win32/x64/*.zip dist-release/ 2>/dev/null || true
        shell: bash

      # --- macOS Build (Apple Silicon arm64 & Intel x64) ---
      - name: Build macOS Binaries (Apple Silicon arm64 & Intel x64)
        if: runner.os == 'macOS'
        run: |
          npx electron-forge make --platform=darwin --arch=arm64
          npx electron-forge make --platform=darwin --arch=x64
          mkdir -p dist-release
          cp out/make/zip/darwin/arm64/*.zip dist-release/Octopus-Studio-macOS-AppleSilicon.zip 2>/dev/null || true
          cp out/make/zip/darwin/x64/*.zip dist-release/Octopus-Studio-macOS-Intel.zip 2>/dev/null || true
          cp out/make/zip/darwin/*/*.zip dist-release/ 2>/dev/null || true
        shell: bash

      # --- Linux Build (.deb & .zip) ---
      - name: Build Linux Installers (.deb & .zip)
        if: runner.os == 'Linux'
        run: |
          npx electron-forge make --platform=linux --arch=x64
          mkdir -p dist-release
          cp out/make/deb/x64/*.deb dist-release/ 2>/dev/null || true
          cp out/make/zip/linux/x64/*.zip dist-release/ 2>/dev/null || true
        shell: bash

      # --- Upload Binaries to GitHub Releases ---
      - name: Upload Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="v1.10.0"; fi
          gh release create "$TAG" dist-release/* --title "Octopus Studio $TAG" --notes "Release $TAG" --clobber || gh release upload "$TAG" dist-release/* --clobber || true
          gh release upload "$TAG" dist-release/* --repo kaleemibnanwar/OctopusStudio --clobber 2>/dev/null || true
        shell: bash
